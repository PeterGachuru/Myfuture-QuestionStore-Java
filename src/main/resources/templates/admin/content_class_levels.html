<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="admin/layout :: styles"></head><body><div th:replace="admin/layout :: header"></div><div th:replace="admin/layout :: sidebar"></div><main id="content" class="content">
<p><a th:href="@{/admin/content}">Curricula</a> / <span th:text="${curriculum.fullname}"></span></p><h2>Class levels</h2><table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Numbering</th><th>Age estimate</th><th>Slug</th><th>Created</th><th>Updated</th><th>Explore</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.numbering}"></td><td th:text="${item.ageEstimate}"></td><td th:text="${item.slug}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.updatedAt != null ? #dates.format(item.updatedAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td><a th:href="@{/admin/content/class-levels/{id}(id=${item.id})}">Subjects</a></td></tr></tbody></table><div th:replace="~{admin/content_pager :: pager(${results}, '/admin/content/curricula/' + ${curriculum.id})}"></div>
</main><div th:replace="admin/layout :: scripts"></div></body></html>
