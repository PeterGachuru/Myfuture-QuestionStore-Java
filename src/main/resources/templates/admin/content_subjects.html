<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="admin/layout :: styles"></head><body><div th:replace="admin/layout :: header"></div><div th:replace="admin/layout :: sidebar"></div><main id="content" class="content">
<p><a th:href="@{/admin/content}">Curricula</a> / <a th:href="@{/admin/content/curricula/{id}(id=${curriculum.id})}" th:text="${curriculum.fullname}"></a> / <a th:href="@{/admin/content/class-levels/{id}(id=${level.id})}" th:text="${level.name}"></a></p><h2>Subjects</h2><table class="admin-table"><thead><tr><th>Relation ID</th><th>Subject ID</th><th>Subject</th><th>Category</th><th>Created</th><th>Updated</th><th>Created by</th><th>Explore</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.subject.id}"></td><td th:text="${item.subject.name}"></td><td th:text="${item.subject.subjectCategory}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.updatedAt != null ? #dates.format(item.updatedAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.createdBy}"></td><td><a th:href="@{/admin/content/class-levels/{levelId}/subjects/{subjectId}(levelId=${level.id},subjectId=${item.subject.id})}">Topics</a></td></tr></tbody></table><div th:replace="~{admin/content_pager :: pager(${results}, '/admin/content/class-levels/' + ${level.id})}"></div>
</main><div th:replace="admin/layout :: scripts"></div></body></html>
