<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><nav th:fragment="pager(results, baseUrl)" style="margin:16px 0; display:flex; gap:12px; align-items:center"><a th:if="${results.hasPrevious()}" th:href="@{${baseUrl}(page=${results.number - 1})}">Previous</a><span th:text="'Page ' + ${results.number + 1} + ' of ' + ${results.totalPages} + ' · ' + ${results.totalElements} + ' records'"></span><a th:if="${results.hasNext()}" th:href="@{${baseUrl}(page=${results.number + 1})}">Next</a></nav></body></html>
