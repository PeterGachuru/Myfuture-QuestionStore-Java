<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/layout :: styles"></head>

<body>

<div th:replace="admin/layout :: header"></div>
<div th:replace="admin/layout :: sidebar"></div>

<div id="content" class="content">

    <h2>Student Profile</h2>

    <!-- BASIC INFO -->
    <div th:replace="admin/fragments/student-info :: info"></div>

    <br>

    <!-- TABS -->
    <div class="tabs">

        <button class="tab-btn active" onclick="openTab('quizzes')">Quizzes</button>
        <button class="tab-btn" onclick="openTab('score-events')">Score history</button>
        <button class="tab-btn" onclick="openTab('referrals')">Referrals</button>
        <button class="tab-btn" onclick="openTab('ratings')">Ratings</button>
        <button class="tab-btn" onclick="openTab('posts')">Posts</button>
        <button class="tab-btn" onclick="openTab('contests')">Contests</button>
        <button class="tab-btn" onclick="openTab('subscriptions')">Subscriptions</button>

    </div>

    <!-- TAB CONTENT -->

    <div id="quizzes" class="tab-content active">
        <div th:replace="admin/fragments/student-quizzes :: quizzes"></div>
    </div>

    <div id="score-events" class="tab-content">
        <h3>Recorded score awards</h3>
        <p>New app versions record score changes here. Older score increases may not have event details.</p>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Received</th><th>Score</th><th>Activity</th><th>Event ID</th><th>Install</th></tr></thead>
                <tbody>
                <tr th:each="scoreEvent : ${scoreEvents}">
                    <td th:text="${scoreEvent.receivedAt}"></td>
                    <td th:text="${scoreEvent.scoreDelta}"></td>
                    <td th:text="${scoreEvent.source}"></td>
                    <td th:text="${scoreEvent.eventId}"></td>
                    <td th:text="${scoreEvent.installId}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(scoreEvents)}"><td colspan="5">No recorded score events yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="referrals" class="tab-content">
        <div th:replace="admin/fragments/student-referrals :: referrals"></div>
    </div>

    <div id="ratings" class="tab-content">
        <div th:replace="admin/fragments/student-ratings :: ratings"></div>
    </div>

    <div id="posts" class="tab-content">
        <div th:replace="admin/fragments/student-posts :: posts"></div>
    </div>

    <div id="contests" class="tab-content">
        <div th:replace="admin/fragments/student-contests :: contests"></div>
    </div>

    <div id="subscriptions" class="tab-content">
        <div th:replace="admin/fragments/student-subscriptions :: subscriptions"></div>
    </div>
</div>

<div th:replace="admin/layout :: scripts"></div>

<style>

    .tabs{
    margin-top:20px;
    }

    .tab-btn{
    padding:10px 20px;
    border:none;
    background:#bdc3c7;
    cursor:pointer;
    margin-right:5px;
    }

    .tab-btn.active{
    background:#2c3e50;
    color:white;
    }

    .tab-content{
    display:none;
    margin-top:20px;
    }

    .tab-content.active{
    display:block;
    }

</style>

<script>

    function openTab(tab){

    document.querySelectorAll(".tab-content").forEach(t=>{
    t.classList.remove("active")
    })

    document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.remove("active")
    })

    document.getElementById(tab).classList.add("active")

    event.target.classList.add("active")

    }

</script>

</body>
</html>
