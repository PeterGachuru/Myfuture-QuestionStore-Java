<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/layout :: styles"></head>

<body>

<div th:replace="admin/layout :: header"></div>
<div th:replace="admin/layout :: sidebar"></div>

<div id="content" class="content">

    <h2>Weekly Scores</h2>
    <p>Top 300 scores for this week</p>

    <table class="admin-table">

        <thead>
        <tr>
            <th>Position</th>
            <th>Student</th>
            <th>Name</th>
            <th>Score</th>
            <th>Class Level</th>
            <th>School</th>
            <th>Created At</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="s : ${scores}">

            <td th:text="${s.position}"></td>

            <!-- Student link -->

            <td>
                <a th:href="@{/admin/students/{id}(id=${s.studentId})}" th:text="${s.studentId}"></a>
            </td>

            <td th:text="${s.name}"></td>
            <td th:text="${s.score}"></td>
            <td th:text="${s.classLevel}"></td>
            <td th:text="${s.school}"></td>
            <td th:text="${#dates.format(s.createdAt,'yyyy-MM-dd HH:mm')}"></td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="admin/layout :: scripts"></div>

<style>

    .admin-table{
    width:100%;
    border-collapse:collapse;
    }

    .admin-table th{
    background:#2c3e50;
    color:black;
    padding:10px;
    }

    .admin-table td{
    padding:8px;
    border-bottom:1px solid #ddd;
    }

    .admin-table tr:hover{
    background:#f5f5f5;
    }

</style>

</body>
</html>
