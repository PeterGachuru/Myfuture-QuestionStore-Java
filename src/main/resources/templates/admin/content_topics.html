<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="admin/layout :: styles"></head><body><div th:replace="admin/layout :: header"></div><div th:replace="admin/layout :: sidebar"></div><main id="content" class="content">
<p><a th:href="@{/admin/content}">Curricula</a> / <a th:href="@{/admin/content/curricula/{id}(id=${curriculum.id})}" th:text="${curriculum.fullname}"></a> / <a th:href="@{/admin/content/class-levels/{id}(id=${level.id})}" th:text="${level.name}"></a></p><h2 th:text="${subjectLevel.subject.name + ' topics'}"></h2><p th:text="'Curriculum: ' + ${curriculum.fullname} + ' · Class: ' + ${level.name} + ' · Subject ID: ' + ${subjectLevel.subject.id}"></p>
<table class="admin-table"><thead><tr><th>ID</th><th>Topic</th><th>Parent</th><th>Slug</th><th>Numbering</th><th>Required</th><th>Created by</th><th>Created</th><th>Updated</th><th>Content</th><th>Browse</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.parent != null ? item.parent.name : '-'}"></td><td th:text="${item.slug}"></td><td th:text="${item.numbering}"></td><td th:text="${item.required}"></td><td th:text="${item.createdBy}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.updatedAt != null ? #dates.format(item.updatedAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.content != null ? #strings.abbreviate(item.content,100) : '-'}"></td><td><a th:href="@{/admin/content/topics/{id}/notes(id=${item.id})}">Notes</a> · <a th:href="@{/admin/content/topics/{id}/questions(id=${item.id})}">Questions</a></td></tr></tbody></table><div th:replace="~{admin/content_pager :: pager(${results}, '/admin/content/class-levels/' + ${level.id} + '/subjects/' + ${subjectLevel.subject.id})}"></div>
</main><div th:replace="admin/layout :: scripts"></div></body></html>
