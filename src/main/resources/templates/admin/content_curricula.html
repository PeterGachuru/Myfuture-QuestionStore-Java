<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="admin/layout :: styles"></head><body><div th:replace="admin/layout :: header"></div><div th:replace="admin/layout :: sidebar"></div><main id="content" class="content">
<h2>Content Library · Curricula</h2><p>Browse curriculum content through class levels, subjects, topics, notes, and questions.</p><table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Full name</th><th>Slug</th><th>Created</th><th>Archived</th><th>Explore</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.fullname}"></td><td th:text="${item.slug}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.archived}"></td><td><a th:href="@{/admin/content/curricula/{id}(id=${item.id})}">Class levels</a></td></tr></tbody></table><div th:replace="~{admin/content_pager :: pager(${results}, '/admin/content')}"></div>
</main><div th:replace="admin/layout :: scripts"></div></body></html>
