<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="admin/layout :: styles"></head><body><div th:replace="admin/layout :: header"></div><div th:replace="admin/layout :: sidebar"></div><main id="content" class="content">
<p><a th:href="@{/admin/content}">Curricula</a> / <a th:href="@{/admin/content/curricula/{id}(id=${curriculum.id})}" th:text="${curriculum.fullname}"></a> / <a th:href="@{/admin/content/class-levels/{id}(id=${level.id})}" th:text="${level.name}"></a> / <a th:href="@{/admin/content/class-levels/{levelId}/subjects/{subjectId}(levelId=${level.id},subjectId=${subject.id})}" th:text="${subject.name}"></a></p><h2 th:text="${contentType + ' for ' + topic.name}"></h2><p th:text="'Topic ID: ' + ${topic.id} + ' · Curriculum: ' + ${curriculum.fullname} + ' · Class: ' + ${level.name} + ' · Subject: ' + ${subject.name}"></p>
<div th:if="${contentType == 'Notes'}"><table class="admin-table"><thead><tr><th>ID</th><th>Book model</th><th>Group</th><th>Created by</th><th>Created</th><th>Updated</th><th>Deleted</th><th>Content</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.bookModel}"></td><td th:text="${item.cgroup}"></td><td th:text="${item.createdBy}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.updatedAt != null ? #dates.format(item.updatedAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.deletedFlag}"></td><td th:text="${item.content != null ? #strings.abbreviate(item.content,180) : '-'}"></td></tr></tbody></table></div>
<div th:if="${contentType == 'Questions'}"><table class="admin-table"><thead><tr><th>ID</th><th>Question</th><th>Book model</th><th>Group</th><th>Edition</th><th>Reviewed</th><th>Approved by AI</th><th>Deleted</th><th>Created</th><th>Updated</th></tr></thead><tbody><tr th:each="item : ${results.content}"><td th:text="${item.id}"></td><td th:text="${item.string != null ? #strings.abbreviate(item.string,180) : '-'}"></td><td th:text="${item.bookModel}"></td><td th:text="${item.cgroup}"></td><td th:text="${item.editionNumber}"></td><td th:text="${item.reviewed}"></td><td th:text="${item.approvedByAI}"></td><td th:text="${item.deleted}"></td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt,'yyyy-MM-dd HH:mm') : '-'}"></td><td th:text="${item.updatedAt != null ? #dates.format(item.updatedAt,'yyyy-MM-dd HH:mm') : '-'}"></td></tr></tbody></table></div><div th:replace="~{admin/content_pager :: pager(${results}, '/admin/content/topics/' + ${topic.id} + '/' + ${#strings.toLowerCase(contentType)})}"></div>
</main><div th:replace="admin/layout :: scripts"></div></body></html>
