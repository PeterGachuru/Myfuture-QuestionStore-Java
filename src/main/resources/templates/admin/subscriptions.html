<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/layout :: styles"></head>

<body>

<div th:replace="admin/layout :: header"></div>
<div th:replace="admin/layout :: sidebar"></div>


<div id="content" class="content">

    <h2>Subscription Plans</h2>


    <!-- ================= PLANS TABLE ================= -->

    <div class="card">

        <h3>Existing Plans</h3>

        <table class="admin-table">

            <thead>
            <tr>
                <th>Name</th>
                <th>Duration (Days)</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="plan : ${plans}">

                <td th:text="${plan.name}"></td>

                <td th:text="${plan.durationDays}"></td>

                <td>
                    <span>$</span>
                    <span th:text="${plan.price}"></span>
                </td>

                <td>
                    <span th:if="${plan.active}" class="badge active">Active</span>
                    <span th:unless="${plan.active}" class="badge disabled">Disabled</span>
                </td>

                <td class="actions">

                    <a th:href="@{/admin/subscriptions/edit/{id}(id=${plan.id})}">
                        <button class="btn-edit">Edit</button>
                    </a>

                    <a th:href="@{/admin/subscriptions/toggle/{id}(id=${plan.id})}">
                        <button class="btn-toggle"
                                th:text="${plan.active} ? 'Disable' : 'Enable'">
                        </button>
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- ================= CREATE / EDIT FORM ================= -->

    <div class="card form-box">

        <h3 th:text="${plan.id != null} ? 'Edit Plan' : 'Create Plan'"></h3>

        <form th:action="@{/admin/subscriptions/save}" method="post" th:object="${plan}">

            <input type="hidden" th:field="*{id}">

            <label>Plan Name</label>
            <input type="text" th:field="*{name}" placeholder="Example: Monthly Plan" required>


            <label>Duration (Days)</label>
            <input type="number" th:field="*{durationDays}" required>


            <label>Price</label>
            <input type="number" step="0.01" th:field="*{price}" required>


            <label class="checkbox">
                <input type="checkbox" th:field="*{active}">
                Active Plan
            </label>


            <button type="submit" class="btn-save">Save Plan</button>

        </form>

    </div>


</div>


<div th:replace="admin/layout :: scripts"></div>


<style>

    .card{
    background:white;
    padding:20px;
    margin-bottom:25px;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }

    .admin-table{
    width:100%;
    border-collapse:collapse;
    }

    .admin-table th{
    background:#2c3e50;
    color:black;
    padding:10px;
    text-align:left;
    }

    .admin-table td{
    padding:10px;
    border-bottom:1px solid #ddd;
    }

    .actions button{
    margin-right:5px;
    }

    .btn-edit{
    background:#3498db;
    color:white;
    border:none;
    padding:6px 12px;
    cursor:pointer;
    }

    .btn-toggle{
    background:#e67e22;
    color:white;
    border:none;
    padding:6px 12px;
    cursor:pointer;
    }

    .btn-save{
    background:#27ae60;
    color:white;
    border:none;
    padding:10px 16px;
    margin-top:10px;
    cursor:pointer;
    }

    .form-box input[type="text"],
    .form-box input[type="number"]{
    width:100%;
    padding:8px;
    margin-top:4px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:4px;
    }

    .badge{
    padding:4px 10px;
    border-radius:4px;
    font-size:12px;
    }

    .badge.active{
    background:#2ecc71;
    color:white;
    }

    .badge.disabled{
    background:#e74c3c;
    color:white;
    }

</style>


</body>
</html>
