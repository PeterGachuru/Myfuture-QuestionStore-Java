<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Select Student | Myfuture CBC Revision</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fafafa;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #800000;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            padding: 6px 12px;
            background: #ccc;
            color: #333;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        /* STUDENT CARD */

        .student-card {
            margin-bottom: 12px;
        }

        .student-btn {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .student-btn:hover {
            background: #fff3e0;
            transform: scale(1.01);
        }

        .student-name {
            font-weight: bold;
            font-size: 16px;
        }

        .student-meta {
            font-size: 13px;
            color: #777;
            margin-top: 7px;
        }

        .student-score {
            color: #800000;
            font-weight: bold;
        }

        .school-badge {
            display: inline-block;
            background: #fff3e0;
            color: #800000;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
        }

        /* EMPTY STATE */

        .empty-box {
            text-align: center;
            padding: 30px 15px;
            color: #777;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        /* CREATE BUTTON */

        .create-section {
            margin-top: 25px;
            text-align: center;
        }

        .create-btn {
            display: inline-block;
            padding: 12px 20px;
            background: #800000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .create-btn:hover {
            background: #660000;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- TOP BAR -->

    <div class="top-bar">

        <span th:if="${session.user != null}">
            👤
            <span th:text="${session.user.firstName}">
                Parent
            </span>
        </span>

        <a href="/read/logout" class="logout-btn">
            Logout
        </a>

    </div>


    <!-- HEADER -->

    <h2>Select Student</h2>

    <div class="subtitle">
        Choose a student to continue learning
    </div>


    <!-- STUDENTS -->

    <div th:if="${students != null and students.size() > 0}">

        <div th:each="s : ${students}" class="student-card">

            <form method="post"
                  action="/read/students/select">

                <input type="hidden"
                       name="studentId"
                       th:value="${s.id}" />

                <button type="submit"
                        class="student-btn">

                    <!-- NAME + SCORE -->

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    ">

                        <span class="student-name"
                              th:text="${s.name}">
                            John Doe
                        </span>

                        <span class="student-score">
                            🏆
                            <span th:text="${s.totalScore}">
                                0
                            </span>
                        </span>

                    </div>


                    <!-- SCHOOL -->

                    <div>

                        <span class="school-badge">

                            🏫

                            <span th:text="${s.school ?: 'No school set'}">
                                No school set
                            </span>

                        </span>

                    </div>


                    <!-- CLASS LEVEL -->

                    <div class="student-meta">

                        📘

                        <span th:text="
                            ${s.curriLevel != null
                                ? s.curriLevel.name
                                : 'No level'}
                        ">
                            Class 6
                        </span>

                    </div>

                </button>

            </form>

        </div>

    </div>


    <!-- EMPTY -->

    <div th:if="${students == null or students.size() == 0}"
         class="empty-box">

        <p>
            No students have been created yet.
        </p>

        <p>
            Create your first student to get started.
        </p>

    </div>


    <!-- CREATE STUDENT -->

    <div class="create-section">

        <a href="/read/students/create"
           class="create-btn">

            ➕ Add New Student

        </a>

    </div>

</div>

</body>

</html>
