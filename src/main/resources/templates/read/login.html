<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Myfuture CBC Revision</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a0f1b, #a61e2c);
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
        }

        /* LEFT SIDE */
        .left-panel {
            flex: 1;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: rgba(0,0,0,0.2);
        }

        .left-panel h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 18px;
            line-height: 1.5;
            max-width: 400px;
        }

        .features {
            margin-top: 30px;
        }

        .features div {
            margin-bottom: 10px;
            font-size: 15px;
        }

        /* RIGHT SIDE */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #6a0f1b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 5px rgba(255,140,0,0.4);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #6a0f1b;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff8c00;
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
            text-align: center;
        }

        .brand {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: #777;
        }

        /* MOBILE */
        @media(max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                padding: 30px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LEFT SIDE (LOGIN FORM NOW HERE) -->
    <div class="left-panel" style="align-items: center;">

        <div class="login-container">
            <h2>Login</h2>

            <form th:action="@{/read/login}" method="post">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required />
                </div>

                <button type="submit">Login</button>

            </form>

            <p th:if="${error}" th:text="${error}" class="error"></p>

            <div class="brand">
                © Myfuture CBC Revision
            </div>
        </div>

    </div>

    <!-- RIGHT SIDE (CONTENT NOW HERE) -->
    <div class="right-panel" style="color:white; padding:60px; flex-direction:column; justify-content:center;">

        <h1>Myfuture CBC Revision</h1>

        <p>
            Master your subjects, track your progress, and compete with other students across Kenya.
        </p>

        <div class="features">
            <div>📘 Structured Notes per Topic</div>
            <div>📝 Interactive Quizzes</div>
            <div>📊 Track Your Performance</div>
            <div>🏆 Compete with Other Students</div>
        </div>

    </div>

</div>

</body>
</html>
