<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px;
        }

        h1 {
            font-size: 72px;
            margin: 0;
            color: #2d3748;
        }

        p {
            color: #4a5568;
            margin: 15px 0 25px;
        }

        a {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #1e4fd6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Oops!</h1>
    <p>The page you are looking for might not exist or has no content yet.</p>
    <a href="/">Go Home</a>
</div>

</body>
</html>
