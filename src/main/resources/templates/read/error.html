<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    ```
    <title>Error</title>

    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico}">

    <link rel="shortcut icon"
          type="image/x-icon"
          th:href="@{/favicon.ico}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 15px;
            color: #2d3748;
        }

        .default-message {
            color: #4a5568;
            margin: 15px 0 25px;
            line-height: 1.6;
        }

        .error-message {
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0 25px;
            line-height: 1.5;
            word-break: break-word;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #1e4fd6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <div class="icon">⚠️</div>

    <h1>Oops!</h1>

    <!-- Display this when an error message is available -->
    <div
            class="error-message"
            th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
            th:text="${errorMessage}">
    </div>

    <!-- Display the default message when there is no error message -->
    <p
            class="default-message"
            th:if="${errorMessage == null or #strings.isEmpty(errorMessage)}">
        The page you are looking for might not exist
        or has no content yet.
    </p>

    <a th:href="@{/read}">
        Go Home
    </a>
    ```

</div>

</body>
</html>
