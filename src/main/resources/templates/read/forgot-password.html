<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - Myfuture CBC Revision</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a0f1b, #a61e2c);
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .left-panel {
            flex: 1;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: rgba(0,0,0,0.2);
            align-items: center;
        }

        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #6a0f1b;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 5px rgba(255,140,0,0.4);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #6a0f1b;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff8c00;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            color: green;
        }

        .error {
            text-align: center;
            margin-top: 10px;
            color: red;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            text-decoration: none;
            color: #6a0f1b;
        }

        .right-panel {
            flex: 1;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media(max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-panel">

        <div class="form-container">
            <h2>Forgot Password</h2>

            <form th:action="@{/read/forgot-password}" method="post">

                <input type="email" name="email" placeholder="Enter your email" required />

                <button type="submit">Send Reset Code</button>

            </form>

            <p th:if="${message}" th:text="${message}" class="message"></p>
            <p th:if="${error}" th:text="${error}" class="error"></p>

            <div class="back">
                <a th:href="@{/read/login}">← Back to Login</a>
            </div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <h1>Reset Your Password</h1>
        <p>
            Enter your email and we will send you a secure code to reset your password.
        </p>
    </div>

</div>

</body>
</html>
