<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Myfuture CBC Revision</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a0f1b, #a61e2c);
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .left-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            color: #6a0f1b;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 5px rgba(255,140,0,0.4);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #6a0f1b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff8c00;
        }

        .error {
            color: red;
            text-align: center;
        }

        .success {
            color: green;
            text-align: center;
        }

        .right-panel {
            flex: 1;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back {
            text-align: center;
            margin-top: 10px;
        }

        .back a {
            text-decoration: none;
            color: #6a0f1b;
        }

        @media(max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-panel">
        <div class="form-container">

            <h2>Create Account</h2>

            <form th:action="@{/read/register}" th:object="${user}" method="post">

                <input type="text" th:field="*{firstName}" placeholder="First Name" required />
                <input type="text" th:field="*{lastName}" placeholder="Last Name" required />
                <input type="email" th:field="*{email}" placeholder="Email" required />
                <input type="text" th:field="*{phone}" placeholder="Phone Number" required />
                <input type="text" th:field="*{county}" placeholder="County" required />

                <select th:field="*{role}">
                    <option value="STUDENT">Student</option>
                    <option value="TEACHER">Teacher</option>
                </select>

                <!-- Hidden fields -->
                <input type="hidden" th:field="*{roleId}" value="1"/>
                <input type="hidden" th:field="*{installId}" value="1"/>

                <input type="password" th:field="*{password}" placeholder="Password" required />

                <button type="submit">Register</button>

            </form>

            <div style="display:flex; align-items:center; margin:20px 0;">
                <hr style="flex:1; border:none; border-top:1px solid #ccc;">
                <span style="margin:0 10px; font-size:12px; color:#777;">OR</span>
                <hr style="flex:1; border:none; border-top:1px solid #ccc;">
            </div>
            <div style="text-align:center; margin-top:15px;">

                <a href="/oauth2/authorization/google" style="text-decoration:none;">
                    <div style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #3c4043;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        "
                         onmouseover="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.2)'"
                         onmouseout="this.style.boxShadow='0 1px 2px rgba(0,0,0,0.1)'"
                    >

                        <!-- Google Logo -->
                        <img src="https://developers.google.com/identity/images/g-logo.png"
                             alt="Google"
                             style="width:18px; height:18px;" />

                        <span>Continue with Google</span>

                    </div>
                </a>

            </div>

            <p th:if="${error}" th:text="${error}" class="error"></p>
            <p th:if="${success}" th:text="${success}" class="success"></p>

            <div class="back">
                <a th:href="@{/read/login}">← Back to Login</a>
            </div>

        </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <h1>Join Myfuture CBC Revision</h1>

        <p>
            Start learning smarter today with structured CBC content and interactive quizzes.
        </p>

        <ul>
            <li>📘 Notes per Topic</li>
            <li>📝 Practice Exams</li>
            <li>📊 Track Progress</li>
            <li>🏆 Compete with Others</li>
        </ul>
    </div>

</div>

</body>
</html>
