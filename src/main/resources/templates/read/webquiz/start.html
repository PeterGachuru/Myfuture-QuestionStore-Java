<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Start Quiz | Myfuture</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .header {
            background: #800020;
            color: white;
            padding: 18px 25px;
            font-size: 21px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            color: #800020;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-bottom: 25px;
            background: white;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #800020;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .loading {
            color: #777;
            font-size: 14px;
            margin-top: -18px;
            margin-bottom: 20px;
            display: none;
        }

    </style>

</head>

<body>

<div class="header">
    Myfuture CBC Revision
</div>


<div class="container">

    <div class="card">

        <h1>Start Quiz</h1>

        <div class="description">
            Select your class and subject to begin your revision.
        </div>


        <form method="post"
              th:action="@{/read/webquiz/start}">

            <label for="classLevel">
                Class Level
            </label>

            <select id="classLevel"
                    name="classLevelId"
                    required>

                <option value="">
                    Select class level
                </option>

                <option th:each="level : ${classLevels}"
                        th:value="${level.id}"
                        th:text="${level.name}">
                </option>

            </select>


            <label for="subject">
                Subject
            </label>

            <select id="subject"
                    name="subjectId"
                    required
                    disabled>

                <option value="">
                    Select class first
                </option>

            </select>

            <div id="loading"
                 class="loading">

                Loading subjects...

            </div>


            <button id="startButton"
                    type="submit"
                    disabled>

                Start Quiz

            </button>

        </form>

    </div>

</div>


<script>

    const classLevel =
        document.getElementById("classLevel");

    const subject =
        document.getElementById("subject");

    const startButton =
        document.getElementById("startButton");

    const loading =
        document.getElementById("loading");


    classLevel.addEventListener("change", function () {

        const classLevelId = this.value;

        subject.innerHTML =
            '<option value="">Loading...</option>';

        subject.disabled = true;
        startButton.disabled = true;

        if (!classLevelId) {

            subject.innerHTML =
                '<option value="">Select class first</option>';

            return;
        }

        loading.style.display = "block";

        fetch(
              "/read/webquiz/subjects?classLevelId="
            + encodeURIComponent(classLevelId),
            {
                method: "GET",
                credentials: "same-origin"
            }
        )

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load subjects");
            }

            return response.json();

        })

        .then(subjects => {

            subject.innerHTML =
                '<option value="">Select subject</option>';

            subjects.forEach(item => {

                const option =
                    document.createElement("option");

                option.value = item.id;
                option.textContent = item.name;

                subject.appendChild(option);

            });

            subject.disabled = false;

        })

        .catch(error => {

            console.error(error);

            subject.innerHTML =
                '<option value="">Unable to load subjects</option>';

        })

        .finally(() => {

            loading.style.display = "none";

        });

    });


    subject.addEventListener("change", function () {

        startButton.disabled =
            !this.value;

    });

</script>

</body>

</html>
