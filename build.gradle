plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.10'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'co.ke.myfuture'
version = '1'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

bootJar {
	archiveFileName = 'myfutureoneapp-1.jar'
}

repositories {
	mavenCentral()
	maven {
		url 'https://repo.e-iceblue.com/nexus/content/groups/public/'
	}
}


dependencies {
	implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.2.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.auth0:java-jwt:3.18.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.security:spring-security-config'
    implementation 'org.jetbrains:annotations:24.0.0'
	implementation 'junit:junit:4.13.1'
	implementation 'junit:junit:4.13.1'
	implementation 'junit:junit:4.13.1'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.0' // Change the version if needed
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.0' // Change the version if needed
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.projectlombok:lombok:1.18.30'
	testImplementation 'com.h2database:h2:2.2.220'
    testImplementation 'junit:junit:4.13.1'
	testImplementation 'junit:junit:4.13.1'
	implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-common', version: '1.8.20'
//Thanks for using https://jar-download.com
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2',
			// Uncomment the next line if you want to use RSASSA-PSS (PS256, PS384, PS512) algorithms:
			'org.bouncycastle:bcprov-jdk15on:1.60',
			'io.jsonwebtoken:jjwt-jackson:0.11.2' // or 'io.jsonwebtoken:jjwt-gson:0.11.2' for gson
	implementation 'org.springframework.boot:spring-boot-starter-mail:2.5.3'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	testImplementation 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
//
	implementation 'io.springfox:springfox-swagger-ui:3.0.0'
//	implementation 'io.springfox:springfox-swagger2:3.0.0'
	implementation 'io.springfox:springfox-boot-starter:3.0.0'

	implementation("com.fasterxml.jackson.module:jackson-module-kotlin")
	implementation("org.jetbrains.kotlin:kotlin-reflect")

	implementation 'org.springframework.boot:spring-boot-starter-mail:3.0.4'
	implementation 'org.modelmapper:modelmapper:3.1.1'
	implementation('com.google.guava:guava:31.1-jre')
	implementation 'com.auth0:java-jwt:4.3.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'javax.validation:validation-api:2.0.1.Final'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation group: 'org.passay', name: 'passay', version: '1.6.2'
	implementation 'com.sun.mail:javax.mail:1.6.2'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'com.prowidesoftware:pw-swift-core:SRU2021-9.2.11'

	implementation group: 'com.opencsv', name: 'opencsv', version: '5.7.1'
	implementation 'org.jsoup:jsoup:1.14.3'
	implementation 'e-iceblue:spire.pdf:9.6.2'

	implementation 'org.jasypt:jasypt:1.9.3'
	implementation 'org.yaml:snakeyaml:1.29'

	implementation 'net.sf.jasperreports:jasperreports:6.17.0'
	implementation 'net.sf.jasperreports:jasperreports-fonts:6.17.0'
	implementation 'com.lowagie:itext:2.1.7'

	implementation "org.apache.httpcomponents:httpclient:4.5.14"
	implementation('jcifs:jcifs:1.3.17') {
		exclude group: 'javax.servlet', module: 'servlet-api'
	}
	implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'
	implementation 'org.bouncycastle:bcprov-jdk15on:1.69'

	// https://mvnrepository.com/artifact/org.eclipse.jetty/jetty-client
	implementation group: 'org.eclipse.jetty', name: 'jetty-client', version: '12.0.7'


	implementation 'org.apache.tika:tika-core:2.9.0'
	implementation 'org.apache.tika:tika-parsers:3.0.0-BETA'
	implementation 'com.jcraft:jsch:0.1.55'
	implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'
	implementation 'com.jcraft:jsch:0.1.55'
//	implementation group: 'org.gradle', name: 'api', version: '1.0'
    implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'
	implementation 'com.opencsv:opencsv:5.5.2' // Use the latest version available

	implementation group: 'org.apache.commons', name: 'commons-text', version: '1.9'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'


	//implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.13.0' // for XML serialization
//	implementation 'org.json:json:20210307' // for converting XML to JSON
}

tasks.named('test') {
	useJUnitPlatform()
}
test {
	// Configure test options if needed
	include '**/*Tests.class' // Include only test classes with names ending in 'Test'
	exclude '**/IntegrationTest.class' // Exclude integration tests
	useJUnitPlatform()
}


