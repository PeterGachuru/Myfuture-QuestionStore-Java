plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'co.ke.myfuture'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_17
}

bootJar {
	archiveFileName = 'myfutureoneapp-1.jar'
}

repositories {
	mavenCentral()
	maven {
		url 'https://repo.e-iceblue.com/nexus/content/groups/public/'
	}
	maven {
		url "https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts/"
	}
}

dependencies {

	// 🌐 Core Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// 🧠 Validation (Jakarta)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 🗄️ Database
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// 🔐 JWT (cleaned)
	implementation 'com.auth0:java-jwt:4.4.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// 📦 Utilities
	implementation 'org.modelmapper:modelmapper:3.2.0'
	implementation 'com.google.guava:guava:33.0.0-jre'
	implementation 'org.apache.commons:commons-lang3:3.14.0'
	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'com.google.code.gson:gson:2.10.1'

	// 📄 File processing
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'com.opencsv:opencsv:5.9'

	implementation 'org.passay:passay:1.6.4'
	implementation 'org.xhtmlrenderer:flying-saucer-pdf-itext5:9.1.22'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 🔐 Encryption
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	// 📊 Reporting / PDF
	implementation 'net.sf.jasperreports:jasperreports:7.0.4'
	implementation 'com.itextpdf:itextpdf:5.5.13.3'

	// 🌍 HTTP clients
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'

	// 🧾 JSON
	implementation 'org.json:json:20240303'

	// ☁️ Google APIs
	implementation 'com.google.api-client:google-api-client:2.2.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'

	// 🔧 Dev tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 🧪 Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'com.google.api-client:google-api-client:2.2.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
	implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'
}

tasks.named('test') {
	useJUnitPlatform()
}