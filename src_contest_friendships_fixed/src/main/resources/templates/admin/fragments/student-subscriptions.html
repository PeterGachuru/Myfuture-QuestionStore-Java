<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="subscriptions">

    <h3>Parent Subscriptions</h3>

    <table class="admin-table">

        <thead>
        <tr>
            <th>S/N</th>
            <th>ID</th>
            <th>Amount</th>
            <th>Days</th>
            <th>Type</th>
            <th>Processor</th>
            <th>Phone</th>
            <th>Transaction</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
            <th>Created</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="s, stat : ${subscriptions}">

            <td th:text="${stat.index + 1}"></td>

            <td th:text="${s.id}"></td>

            <td th:text="${s.payAmount}"></td>

            <td th:text="${s.numberOfDays}"></td>

            <td th:text="${s.subscriptionType}"></td>

            <td th:text="${s.paymentProcessor}"></td>

            <td th:text="${s.phoneNumber}"></td>

            <td th:text="${s.transactionCode}"></td>

            <td th:text="${#dates.format(s.startDate,'yyyy-MM-dd')}"></td>

            <td th:text="${#dates.format(s.endDate,'yyyy-MM-dd')}"></td>

            <td>

<span th:if="${s.endDate.after(#dates.createNow())}" class="status-active">
ACTIVE
</span>

                <span th:unless="${s.endDate.after(#dates.createNow())}" class="status-expired">
EXPIRED
</span>

            </td>

            <td th:text="${#dates.format(s.createdAt,'yyyy-MM-dd HH:mm')}"></td>

        </tr>

        </tbody>

    </table>

    <style>

        .status-active{
        background:#2ecc71;
        color:white;
        padding:4px 8px;
        border-radius:4px;
        font-weight:bold;
        }

        .status-expired{
        background:#e74c3c;
        color:white;
        padding:4px 8px;
        border-radius:4px;
        font-weight:bold;
        }

    </style>

</div>
</body>
</html>
