<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Commonauth Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2a5298;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1e3c72;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }

        .brand {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Commonauth Admin</h2>

    <form th:action="@{/admin/login}" method="post">

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit">Login</button>

    </form>

    <p th:if="${error}" th:text="${error}" class="error"></p>

    <div class="brand">
        © Commonauth Admin Panel
    </div>

</div>

</body>
</html>
