<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Student | Myfuture CBC Revision</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fafafa;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #800000;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            padding: 6px 12px;
            background: #ccc;
            color: #333;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        .back-btn {
            text-decoration: none;
            color: #800000;
            font-size: 14px;
            font-weight: bold;
        }

        /* FORM */

        .form-box {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 7px;
            border: 1px solid #ccc;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #800000;
        }

        .optional {
            font-weight: normal;
            color: #999;
        }

        .create-btn {
            width: 100%;
            padding: 13px;
            background: #800000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        .create-btn:hover {
            background: #660000;
        }

        .info {
            margin-top: 18px;
            padding: 12px;
            background: #fff3e0;
            border-radius: 8px;
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- TOP BAR -->

    <div class="top-bar">

        <a href="/read/students/select"
           class="back-btn">
            ← Back to Students
        </a>

        <a href="/read/logout"
           class="logout-btn">
            Logout
        </a>

    </div>


    <!-- HEADER -->

    <h2>Create New Student</h2>

    <div class="subtitle">
        Add a student to your Myfuture learning account
    </div>


    <!-- FORM -->

    <div class="form-box">

        <form method="post"
              action="/read/students/create">


            <!-- FIRST NAME -->

            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input type="text"
                       id="firstName"
                       name="firstName"
                       placeholder="Enter first name"
                       required>

            </div>


            <!-- LAST NAME -->

            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input type="text"
                       id="lastName"
                       name="lastName"
                       placeholder="Enter last name"
                       required>

            </div>


            <!-- SCHOOL -->

            <div class="form-group">

                <label for="school">
                    School
                    <span class="optional">
                        (Optional)
                    </span>
                </label>

                <input type="text"
                       id="school"
                       name="school"
                       placeholder="Enter school name">

            </div>


            <!-- CLASS LEVEL -->

            <div class="form-group">

                <label for="classlevel">
                    Class Level
                </label>

                <select id="classlevel"
                        name="classlevel"
                        required>

                    <option value="">
                        Select Class Level
                    </option>

                    <option th:each="lvl : ${classLevels}"
                            th:value="${lvl.id}"
                            th:text="${lvl.name}">
                    </option>

                </select>

            </div>


            <!-- CREATE -->

            <button type="submit"
                    class="create-btn">

                Create Student

            </button>

        </form>


        <!-- INFORMATION -->

        <div class="info">

            💡 After creating the student, they will be
            automatically selected and you can continue to
            their learning profile.

        </div>

    </div>

</div>

</body>

</html>
